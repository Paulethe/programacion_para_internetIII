<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Equipos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Sistema de Registro de Equipos</span>
  </div>
</nav>

<div class="container pb-5">
  <div class="row g-4">

    <!-- Columna que esta del lado izquierdo -->
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          Registro de Equipo
        </div>
        <div class="card-body">

          <form id="formEquipo" novalidate>

            <div class="mb-3">
              <label for="codigo" class="form-label">Código del Equipo</label>
              <input type="text" class="form-control" id="codigo" placeholder="Ej: E001">
              <div class="error-msg" id="errorCodigo"></div>
            </div>

            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre del Dispositivo</label>
              <input type="text" class="form-control" id="nombre" placeholder="Ej: Servidor Dell R740">
              <div class="error-msg" id="errorNombre"></div>
            </div>

            <div class="mb-3">
              <label for="categoria" class="form-label">Categoría</label>
              <select class="form-select" id="categoria">
                <option value="" selected disabled>Seleccione una categoría...</option>
                <option value="Servidores">Servidores</option>
                <option value="Redes">Redes</option>
                <option value="Laptops">Laptops</option>
              </select>
              <div class="error-msg" id="errorCategoria"></div>
            </div>

            <div class="mb-3">
              <label for="precio" class="form-label">Precio Unitario (USD)</label>
              <input type="number" step="0.01" class="form-control" id="precio" placeholder="Ej: 1500.00">
              <div class="error-msg" id="errorPrecio"></div>
            </div>

            <button type="button" id="btnRegistrar" class="btn btn-primary w-100">
              Registrar Equipo
            </button>

          </form>

        </div>
      </div>
    </div>

    <!-- Columna del lado derecho -->
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
          <span>Equipos Registrados</span>
          <span class="badge bg-light text-dark fs-6" id="contador">0</span>
        </div>
        <div class="card-body">

          <div class="table-responsive">
            <table class="table table-striped align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Código</th>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th>Precio</th>
                </tr>
              </thead>
              <tbody id="tablaBody">
                <!-- Aqui inyectamos las filas -->
              </tbody>
            </table>
          </div>

          <button type="button" id="btnLimpiar" class="btn btn-outline-danger w-100">
            Limpiar Tabla
          </button>

        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {

  let contador = 0;

  const codigoInput    = document.getElementById('codigo');
  const nombreInput    = document.getElementById('nombre');
  const categoriaInput = document.getElementById('categoria');
  const precioInput    = document.getElementById('precio');

  const errorCodigo    = document.getElementById('errorCodigo');
  const errorNombre    = document.getElementById('errorNombre');
  const errorCategoria = document.getElementById('errorCategoria');
  const errorPrecio    = document.getElementById('errorPrecio');

  const tablaBody   = document.getElementById('tablaBody');
  const contadorTag = document.getElementById('contador');

  function limpiarErrores() {
    [errorCodigo, errorNombre, errorCategoria, errorPrecio].forEach(el => el.textContent = '');
    [codigoInput, nombreInput, categoriaInput, precioInput].forEach(el => el.classList.remove('is-invalid'));
  }

  function marcarError(input, errorEl, mensaje) {
    input.classList.add('is-invalid');
    errorEl.textContent = mensaje;
  }

  function formatoMoneda(valor) {
    return '$' + Number(valor).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  document.getElementById('btnRegistrar').addEventListener('click', function () {

    limpiarErrores();

    const codigo    = codigoInput.value.trim();
    const nombre    = nombreInput.value.trim();
    const categoria = categoriaInput.value;
    const precio    = precioInput.value;

    let esValido = true;

    // Validación Código: debe empezar con "E" seguido de números
    const regexCodigo = /^E\d+$/;
    if (codigo === '') {
      marcarError(codigoInput, errorCodigo, 'El código no puede estar vacío.');
      esValido = false;
    } else if (!regexCodigo.test(codigo)) {
      marcarError(codigoInput, errorCodigo, 'El código debe iniciar con "E" seguido de números (Ej: E001).');
      esValido = false;
    }

    // Validación Nombre: mínimo 5 caracteres
    if (nombre.length < 5) {
      marcarError(nombreInput, errorNombre, 'El nombre debe tener al menos 5 caracteres.');
      esValido = false;
    }

    // Validación Categoría: opción válida distinta de la default
    if (categoria === '') {
      marcarError(categoriaInput, errorCategoria, 'Debe seleccionar una categoría válida.');
      esValido = false;
    }

    // Validación Precio: numérico y mayor que cero
    if (precio === '' || isNaN(precio) || Number(precio) <= 0) {
      marcarError(precioInput, errorPrecio, 'El precio debe ser un número mayor que cero.');
      esValido = false;
    }

    if (!esValido) return;

    // Inyectar fila en la tabla
    const fila = document.createElement('tr');
    fila.innerHTML =
      '<td>' + codigo + '</td>' +
      '<td>' + nombre + '</td>' +
      '<td>' + categoria + '</td>' +
      '<td>' + formatoMoneda(precio) + '</td>';
    tablaBody.appendChild(fila);

    // Actualizar contador
    contador++;
    contadorTag.textContent = contador;

    // Limpiar formulario
    codigoInput.value = '';
    nombreInput.value = '';
    categoriaInput.value = '';
    precioInput.value = '';
    codigoInput.focus();
  });

  document.getElementById('btnLimpiar').addEventListener('click', function () {
    if (tablaBody.children.length === 0) return;

    const confirmar = confirm('¿Estás seguro de que deseas vaciar toda la tabla? Esta acción no se puede deshacer.');
    if (confirmar) {
      tablaBody.innerHTML = '';
      contador = 0;
      contadorTag.textContent = contador;
    }
  });

})();
</script>

</body>
</html>
